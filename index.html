<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eudaimonai · Focus sessions for Mac</title>
    <meta name="description" content="Eudaimonai is a Mac app for focus sessions. It measures your attention during each session, on your Mac, and sums up your day in one Focus Score. Closed beta." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eudaimonai · Focus sessions for Mac" />
    <meta property="og:description" content="Focus you can see, day after day. Focus sessions for Apple Silicon Macs. Your focus data stays on your Mac." />
    <meta property="og:url" content="https://eudaimonai.app/" />
    <meta property="og:image" content="https://eudaimonai.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#1a2e4a" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister())
          })
        })
      }
    </script>
  </body>
</html>
