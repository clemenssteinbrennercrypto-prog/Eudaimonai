name: Test Companion

# Internal Companion build for main. This verifies the bundled UI, produces a
# Developer ID signed and notarized macOS build, and publishes a prerelease
# updater channel using Tauri updater signatures.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/refresh-companion-webui.mjs'
      - 'companion/**'
      - '.github/workflows/companion-test.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: companion-test-main
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check preinstalled Node.js
        run: |
          node --version
          npm --version

      - name: Install web dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable 2026-10-03
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: companion/src-tauri

      # The Rust unit tests (session database, blocking, output, updater) were
      # previously only ever run by hand — the build below compiles the crate
      # but never executes them, so a broken invariant could ship unnoticed.
      - name: Run Rust unit tests
        run: cargo test --manifest-path companion/src-tauri/Cargo.toml

      - name: Set internal build identity
        run: |
          set -euo pipefail
          version="0.1.$(date -u +%y%m%d%H%M)"

          python3 - <<PY
          import json
          p = 'companion/src-tauri/tauri.conf.json'
          d = json.load(open(p))
          d['version'] = '${version}'
          json.dump(d, open(p, 'w'), indent=2)
          print('version set to', d['version'])
          PY

          {
            echo "EUDONOMIA_BUILD_VERSION=$version"
            echo "EUDONOMIA_BUILD_CHANNEL=test"
            echo "EUDONOMIA_BUILD_ID=test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
            echo "EUDONOMIA_BUILD_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Refresh bundled companion UI
        run: npm run refresh:companion-webui

      - name: Verify bundled companion UI
        run: npm run verify:companion-webui

      - name: Validate internal signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required internal signing secret(s): %s\n' "${missing[*]}" >&2
            echo "Refusing to publish an unsigned or unnotarized internal build." >&2
            exit 1
          fi

      - name: Build signed companion
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          args: --target aarch64-apple-darwin --config src-tauri/tauri.test.conf.json

      - name: Notarize and staple internal disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmg_count="$(find "$bundle_root" -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [ "$dmg_count" -ne 1 ]; then
            echo "Expected exactly one signed DMG, found $dmg_count." >&2
            exit 1
          fi

          dmg="$(find "$bundle_root" -type f -name '*.dmg' | head -n 1)"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Verify signed and notarized internal artifacts
        run: |
          set -euo pipefail

          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"

          app_count=0
          while IFS= read -r app; do
            app_count=$((app_count + 1))
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$app"
          done < <(find "$bundle_root" -name '*.app' -type d)

          if [ "$app_count" -eq 0 ]; then
            echo "No .app bundle found under $bundle_root" >&2
            exit 1
          fi

          executable_count=0
          while IFS= read -r executable; do
            executable_count=$((executable_count + 1))
            archs="$(lipo -archs "$executable")"
            if [ "$archs" != "arm64" ]; then
              echo "Expected arm64-only executable, found '$archs': $executable" >&2
              exit 1
            fi
          done < <(find "$bundle_root" -path '*/Contents/MacOS/*' -type f)

          if [ "$executable_count" -eq 0 ]; then
            echo "No app executable found under $bundle_root" >&2
            exit 1
          fi

          dmg_count=0
          while IFS= read -r dmg; do
            dmg_count=$((dmg_count + 1))
            xcrun stapler validate "$dmg"
            /usr/sbin/spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done < <(find "$bundle_root" -name '*.dmg' -type f)

          if [ "$dmg_count" -eq 0 ]; then
            echo "No .dmg found under $bundle_root" >&2
            exit 1
          fi

      - name: Verify internal updater signature
        run: |
          set -euo pipefail

          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"
          archive_count="$(find "$bundle_root" -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')"
          if [ "$archive_count" -ne 1 ]; then
            echo "Expected exactly one updater archive, found $archive_count." >&2
            exit 1
          fi

          archive="$(find "$bundle_root" -type f -name '*.app.tar.gz' | head -n 1)"
          signature="${archive}.sig"
          if [ ! -f "$signature" ]; then
            echo "Missing updater signature for $(basename "$archive")." >&2
            exit 1
          fi

          node scripts/verify-tauri-updater-signature.mjs \
            "$archive" \
            "$signature" \
            companion/src-tauri/tauri.conf.json \
            "$EUDONOMIA_BUILD_VERSION"

      - name: Upload signed app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eudaimonai-companion-test-${{ github.run_number }}
          path: |
            companion/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app
            companion/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
          if-no-files-found: error

      - name: Publish internal updater channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"
          release_dir="$(mktemp -d)"

          find "$bundle_root" -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name 'latest.json' \) -exec cp {} "$release_dir/" \;

          dmg_count="$(find "$bundle_root" -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [ "$dmg_count" -ne 1 ]; then
            echo "Expected exactly one signed DMG, found $dmg_count." >&2
            exit 1
          fi
          dmg_path="$(find "$bundle_root" -type f -name '*.dmg' | head -n 1)"
          cp "$dmg_path" "$release_dir/Eudaimonai-Test.dmg"

          if ! find "$release_dir" -type f -name '*.app.tar.gz' | grep -q .; then
            echo "No .app.tar.gz updater archive was produced." >&2
            exit 1
          fi

          if ! find "$release_dir" -type f -name '*.app.tar.gz.sig' | grep -q .; then
            echo "No updater signature was produced." >&2
            exit 1
          fi

          python3 - "$release_dir" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          release_dir = Path(sys.argv[1])
          archives = sorted(release_dir.glob("*.app.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one updater archive, found {len(archives)}")

          archive = archives[0]
          sig_path = release_dir / f"{archive.name}.sig"
          if not sig_path.is_file():
              raise SystemExit(f"Missing updater signature for {archive.name}")

          signature = sig_path.read_text(encoding="utf-8").strip()
          if not signature:
              raise SystemExit(f"Updater signature is empty: {sig_path.name}")

          version = os.environ.get("EUDONOMIA_BUILD_VERSION")
          if not version:
              raise SystemExit("EUDONOMIA_BUILD_VERSION is required to generate latest.json")

          asset_url = (
              "https://github.com/clemenssteinbrennercrypto-prog/Eudaimonai"
              f"/releases/download/internal-test/{quote(archive.name)}"
          )
          platform = {"signature": signature, "url": asset_url}
          latest = {
              "version": version,
              "notes": f"Internal test build {os.environ.get('GITHUB_RUN_NUMBER', '')} ({os.environ.get('GITHUB_SHA', '')[:7]})".strip(),
              "pub_date": datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "platforms": {
                  "darwin-aarch64": platform,
              },
          }

          (release_dir / "latest.json").write_text(
              json.dumps(latest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          python3 - "$release_dir/latest.json" <<'PY'
          import json
          import sys

          latest_path = sys.argv[1]
          latest = json.load(open(latest_path))
          platforms = latest.get("platforms") or {}
          if not platforms:
              raise SystemExit("latest.json does not contain updater platforms")

          required = {"darwin-aarch64"}
          missing = required - set(platforms)
          if missing:
              raise SystemExit(f"latest.json is missing required platform(s): {', '.join(sorted(missing))}")
          unexpected = set(platforms) - required
          if unexpected:
              raise SystemExit(
                  f"latest.json advertises unsupported platform(s): {', '.join(sorted(unexpected))}"
              )

          bad = []
          for name, metadata in platforms.items():
              url = metadata.get("url", "")
              signature = metadata.get("signature", "")
              if "releases/download/internal-test/" not in url:
                  bad.append(f"{name}: unexpected url {url!r}")
              if not signature:
                  bad.append(f"{name}: missing signature")

          if bad:
              raise SystemExit("\n".join(bad))
          PY

          if gh release view internal-test >/dev/null 2>&1; then
            existing_assets="$(gh release view internal-test --json assets --jq '.assets[].name')"
          else
            gh release create internal-test \
              --title "Eudaimonai Friends Test" \
              --notes "Signed and notarized Apple Silicon builds for invited testers. In-app updates follow successful main builds." \
              --prerelease
            existing_assets=""
          fi

          gh release upload internal-test "$release_dir"/* --clobber

          if [ -n "$existing_assets" ]; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              if [ ! -f "$release_dir/$asset" ]; then
                gh release delete-asset internal-test "$asset" -y
              fi
            done <<< "$existing_assets"
          fi

          gh release edit internal-test \
            --title "Eudaimonai Friends Test" \
            --notes "Signed and notarized Apple Silicon builds for invited testers. In-app updates follow successful main builds." \
            --prerelease

          git tag -f internal-test "$GITHUB_SHA"
          git push -f origin refs/tags/internal-test
