name: Release Companion

# Production-only Companion pipeline. Builds a signed Apple Silicon macOS app,
# notarizes and staples the DMG, verifies Gatekeeper acceptance, then waits for
# protected-environment approval before publishing the native updater release.

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the release-v prefix'
        required: true
        type: string
      publish:
        description: 'Publish the verified build as the public latest release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    outputs:
      publish: ${{ steps.release-meta.outputs.publish }}
      version: ${{ steps.release-meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check preinstalled Node.js
        run: |
          node --version
          npm --version

      - name: Install web dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable 2026-10-03
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: companion/src-tauri

      - name: Validate release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required release secret(s): %s\n' "${missing[*]}" >&2
            printf 'Refusing to publish an unsigned or unnotarized macOS build.\n' >&2
            exit 1
          fi

      - name: Set release build identity
        id: release-meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#release-v}"
            publish=true
          else
            version="${INPUT_VERSION}"
            publish="${INPUT_PUBLISH:-false}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be semver-like: $version" >&2
            exit 1
          fi

          python3 - <<PY
          import json
          p = 'companion/src-tauri/tauri.conf.json'
          d = json.load(open(p))
          d['version'] = '${version}'
          json.dump(d, open(p, 'w'), indent=2)
          print('version set to', d['version'])
          PY

          {
            echo "EUDONOMIA_BUILD_VERSION=$version"
            echo "EUDONOMIA_BUILD_CHANNEL=release"
            echo "EUDONOMIA_BUILD_ID=release-v$version-${GITHUB_SHA::7}"
            echo "EUDONOMIA_BUILD_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refresh bundled companion UI
        run: npm run refresh:companion-webui

      - name: Verify bundled companion UI
        run: npm run verify:companion-webui

      - name: Build private signed release candidate
        if: steps.release-meta.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json

      - name: Build public release draft
        id: tauri-build
        if: steps.release-meta.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tagName: release-v__VERSION__
          releaseName: 'Eudonomia v__VERSION__'
          releaseBody: |
            Download the macOS `.dmg` asset to install Eudonomia.

            The `.app.tar.gz`, `.sig`, and `latest.json` assets are for the signed Tauri updater, not manual installation.
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: '[name]-[version]-[arch][ext]'
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json

      - name: Notarize and staple release disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmg_count="$(find "$bundle_root" -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [ "$dmg_count" -ne 1 ]; then
            echo "Expected exactly one signed DMG, found $dmg_count." >&2
            exit 1
          fi

          dmg="$(find "$bundle_root" -type f -name '*.dmg' | head -n 1)"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Verify signed and notarized macOS artifacts
        run: |
          set -euo pipefail

          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"

          app_count=0
          while IFS= read -r app; do
            app_count=$((app_count + 1))
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$app"
          done < <(find "$bundle_root" -name '*.app' -type d)

          if [ "$app_count" -eq 0 ]; then
            echo "No .app bundle found under $bundle_root" >&2
            exit 1
          fi

          executable_count=0
          while IFS= read -r executable; do
            executable_count=$((executable_count + 1))
            archs="$(lipo -archs "$executable")"
            if [ "$archs" != "arm64" ]; then
              echo "Expected arm64-only executable, found '$archs': $executable" >&2
              exit 1
            fi
          done < <(find "$bundle_root" -path '*/Contents/MacOS/*' -type f)

          if [ "$executable_count" -eq 0 ]; then
            echo "No app executable found under $bundle_root" >&2
            exit 1
          fi

          dmg_count=0
          while IFS= read -r dmg; do
            dmg_count=$((dmg_count + 1))
            xcrun stapler validate "$dmg"
            /usr/sbin/spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done < <(find "$bundle_root" -name '*.dmg' -type f)

          if [ "$dmg_count" -eq 0 ]; then
            echo "No .dmg found under $bundle_root" >&2
            exit 1
          fi

      - name: Verify release updater signature
        run: |
          set -euo pipefail

          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"
          archive_count="$(find "$bundle_root" -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')"
          if [ "$archive_count" -ne 1 ]; then
            echo "Expected exactly one updater archive, found $archive_count." >&2
            exit 1
          fi

          archive="$(find "$bundle_root" -type f -name '*.app.tar.gz' | head -n 1)"
          signature="${archive}.sig"
          if [ ! -f "$signature" ]; then
            echo "Missing updater signature for $(basename "$archive")." >&2
            exit 1
          fi

          node scripts/verify-tauri-updater-signature.mjs \
            "$archive" \
            "$signature" \
            companion/src-tauri/tauri.conf.json \
            "$EUDONOMIA_BUILD_VERSION"

      - name: Replace public draft disk image with verified stapled artifact
        if: steps.release-meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail

          tag="release-v${VERSION}"
          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmg="$(find "$bundle_root" -type f -name '*.dmg' | head -n 1)"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          asset_count="$(jq '[.assets[] | select(.name | endswith(".dmg"))] | length' <<< "$release_json")"
          if [ "$asset_count" -ne 1 ]; then
            echo "Expected exactly one DMG asset in the public draft, found $asset_count." >&2
            exit 1
          fi

          asset_id="$(jq -r '.assets[] | select(.name | endswith(".dmg")) | .id' <<< "$release_json")"
          asset_name="$(jq -r '.assets[] | select(.name | endswith(".dmg")) | .name' <<< "$release_json")"
          upload_dir="$(mktemp -d)"
          cp "$dmg" "$upload_dir/$asset_name"

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          gh release upload "$tag" "$upload_dir/$asset_name"

      - name: Upload private validated release candidate
        if: steps.release-meta.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eudaimonai-signed-release-candidate-${{ github.run_number }}
          path: |
            companion/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app
            companion/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            companion/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz
            companion/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    name: Publish verified production release
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-release
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "release-v${VERSION}" --draft=false --latest
